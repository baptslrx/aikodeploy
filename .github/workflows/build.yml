name: Compiler AikoDeploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Préparer
        run: mkdir -p screenshots
      - name: Compilation de l'appli (universelle)
        if: always()
        run: |
          set +e
          UNIVERSAL=1 ./macos/build.sh > screenshots/build.log 2>&1
          code=$?
          codesign -d -r- macos/build/AikoDeploy.app >> screenshots/build.log 2>&1
          cat screenshots/build.log
          grep -E "error:" screenshots/build.log | head -n 15 | while IFS= read -r l; do echo "::error title=Compilation::$l"; done
          exit $code
      - name: Serveurs de test (FTP et SFTP sur cette machine)
        run: |
          set +e
          export FTPROOT="$RUNNER_TEMP/ftp"
          mkdir -p "$FTPROOT"
          python3 -m pip install --quiet --user --break-system-packages pyftpdlib || python3 -m pip install --quiet --user pyftpdlib
          nohup python3 -m pyftpdlib -i 127.0.0.1 -p 2121 -u aiko -P motdepasse-test -d "$FTPROOT" -w > "$RUNNER_TEMP/ftp.log" 2>&1 &
          echo "AIKO_FTP_PORT=2121" >> "$GITHUB_ENV"
          echo "AIKO_FTP_ROOT=$FTPROOT" >> "$GITHUB_ENV"
          # SFTP : le serveur SSH de macOS, avec une clé créée pour l'occasion
          ssh-keygen -q -t ed25519 -N "" -f "$HOME/.ssh/aiko_test"
          cat "$HOME/.ssh/aiko_test.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"; chmod 600 "$HOME/.ssh/authorized_keys"
          sudo systemsetup -setremotelogin on >/dev/null 2>&1 || sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist
          sleep 3
          if ssh -i "$HOME/.ssh/aiko_test" -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$USER@127.0.0.1" true; then
            mkdir -p "$RUNNER_TEMP/sftp-site"
            echo "AIKO_SFTP_USER=$USER" >> "$GITHUB_ENV"
            echo "AIKO_SFTP_KEY=$HOME/.ssh/aiko_test" >> "$GITHUB_ENV"
            echo "AIKO_SFTP_ROOT=$(cd "$RUNNER_TEMP/sftp-site" && pwd -P)" >> "$GITHUB_ENV"
          else
            echo "::warning title=SFTP::serveur SSH indisponible sur la machine de test"
          fi
          sleep 1
          curl -s --list-only --user aiko:motdepasse-test ftp://127.0.0.1:2121/ && echo "FTP prêt"
      - name: Test en direct (vrais envois FTP / SFTP)
        timeout-minutes: 6
        run: |
          ./macos/build/AikoDeploy.app/Contents/MacOS/AikoDeploy --selftest "$PWD/screenshots" 2>&1 | tee screenshots/appli.txt
      - name: Publier le rapport (branche captures-Mac)
        if: always()
        run: |
          cd screenshots || exit 0
          git init -q -b captures-Mac
          git -c user.name=ci -c user.email=ci@aikodeploy add -A
          git -c user.name=ci -c user.email=ci@aikodeploy commit -q -m "Rapport Mac" || exit 0
          ls -la
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:captures-Mac > push.txt 2>&1 \
            || { tail -n 5 push.txt | while IFS= read -r l; do echo "::error title=Envoi du rapport::$l"; done; exit 1; }
      - name: Archive
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent macos/build/AikoDeploy.app dist/AikoDeploy-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AikoDeploy-Mac
          path: dist/AikoDeploy-Mac.zip
